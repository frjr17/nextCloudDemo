services:
  db:
    image: mariadb:10.6
    restart: always
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    volumes:
      - ~/nextcloud/db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=superUltraMegaSecret
      - MYSQL_PASSWORD=flisol2026
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud

  app:
    image: nextcloud
    restart: always
    ports:
      - 80:80
    volumes:
      - ~/nextcloud/cloud:/var/www/html
    environment:
      - MYSQL_PASSWORD=flisol2026
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_HOST=db

